name: password-manager CI

on:
  push:
    paths:
      - "password-manager/**"
  pull_request:
    paths:
      - "password-manager/**"

defaults:
  run:
    working-directory: password-manager

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: password_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: password-manager/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build --workspace shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npm run prisma:generate --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/password_manager?schema=public

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/password_manager?schema=public

      - name: Build extension
        run: npm run build --workspace extension
